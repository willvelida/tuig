name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ripgrep and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs (runner VM only).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --die-with-parent --unshare-all --ro-bind / / true
      - name: Check sandbox-exec (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' /usr/bin/true
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
      - run: rg --version
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          # Sandbox acceptance tests must run, not skip, in CI.
          TUIG_REQUIRE_SANDBOX: '1'
      - run: npm run docs:check
      - run: npm run fixtures:check
      - run: npm run build:binary
      - run: node scripts/smoke-binary.mjs
